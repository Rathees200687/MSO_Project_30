kannst du den Code mal als HTML einbetten in die index Datei. 

<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Video Experience</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
      font-family: Arial, sans-serif;
    }

    video {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      object-fit: contain;
      background: black;
    }

    #overlay {
      position: fixed;
      inset: 0;
      background: black;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      z-index: 10;
      padding: 24px;
    }

    .content {
      max-width: 700px;
    }

    h1 {
      font-size: clamp(38px, 8vw, 72px);
      margin-bottom: 18px;
      line-height: 1.1;
    }

    p {
      font-size: 18px;
      opacity: 0.85;
      margin-bottom: 36px;
      line-height: 1.5;
    }

    button {
      font-size: 22px;
      padding: 18px 36px;
      border-radius: 999px;
      border: none;
      background: white;
      color: black;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <video
    id="video"
    controls
    preload="auto">

    <source
      src="/./media/VIDEO.mp4" type="video/mp4">
      type="video/mp4">
  </video>

  <div id="overlay">
    <div class="content">
      <h1>Ein Moment, der bleibt.</h1>

      <p>
        Tippe auf Play. Danach kannst du das Handy ins Querformat drehen.
      </p>

      <button id="startButton">
        ▶️ Video ansehen
      </button>
    </div>
  </div>

  <script>
    const video = document.getElementById("video");
    const overlay = document.getElementById("overlay");

    async function startExperience() {
      try {
        video.muted = false;
        video.volume = 1;

        await video.play();

        overlay.style.display = "none";

        // iPhone/Safari: nativen Video-Vollbildmodus versuchen
        if (video.webkitEnterFullscreen) {
          video.webkitEnterFullscreen();
        }

      } catch (error) {
        console.log(error);
      }
    }

    document.getElementById("startButton")
      .addEventListener("click", startExperience);
  </script>

</body>
</html>
